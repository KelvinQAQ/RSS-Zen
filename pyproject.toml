[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rss-zen"
version = "0.1.0"
description = "Local multilingual RSS-to-Markdown workflow"
license = "MIT"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "apscheduler>=3.11,<4",
  "beautifulsoup4>=4.12,<5",
  "feedparser>=6.0.11,<7",
  "httpx>=0.28,<1",
  "langdetect>=1.0.9,<2",
  "markdownify>=1.1,<2",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.15,<1",
]

[project.scripts]
rss-zen = "rss_zen.cli:app"

[dependency-groups]
dev = [
  "pip-audit>=2.8,<3",
  "pytest>=9.0.3,<10",
  "pytest-httpx>=0.35,<1",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/rss_zen/cli.py" = ["B008"]

[tool.hatch.build.targets.wheel]
packages = ["src/rss_zen"]
